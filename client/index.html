<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0b0d12"
    />

    <meta
      name="description"
      content="StudyOS — your personal study workspace for tasks, subjects, notes, focus sessions, calendar and progress."
    />

    <!-- ===================================================
         AUTH NETWORK WARM-UP

         These only establish DNS/TLS connections early.
         They do not send credentials or sign the user in.
    ==================================================== -->

    <link
      rel="preconnect"
      href="https://accounts.google.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://identitytoolkit.googleapis.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://securetoken.googleapis.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="//accounts.google.com"
    />

    <link
      rel="dns-prefetch"
      href="//identitytoolkit.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//securetoken.googleapis.com"
    />

    <link
      rel="preload"
      href="https://accounts.google.com/gsi/client"
      as="script"
      crossorigin
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <title>StudyOS</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
