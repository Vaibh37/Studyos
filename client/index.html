  <body>
    <div id="root">
      <main id="studyos-startup" style="min-height:100vh;display:grid;place-items:center;background:#101113;color:#f2f3f5;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box;">
        <div style="max-width:400px;">
          <h1 id="studyos-startup-heading" style="font-size:24px;margin:0 0 10px;font-weight:650;">Loading StudyOS…</h1>
          <p id="studyos-startup-description" role="status" style="font-size:14px;line-height:1.6;color:#a3a6ad;margin:0 0 16px;">Preparing your workspace.</p>
          <a id="studyos-startup-retry" hidden style="display:none;background:#eceef2;color:#16191e;font-size:14px;font-weight:600;text-decoration:none;padding:12px 16px;border-radius:8px;" href="">Reload StudyOS</a>
          <noscript><p style="font-size:14px;line-height:1.6;">JavaScript is required to open StudyOS. Enable it and reload this page.</p></noscript>
        </div>
      </main>
    </div>
    <script>
      // This fallback still works if the entry bundle fails before React starts.
      (() => {
        const panel = document.getElementById("studyos-startup");
        const retry = document.getElementById("studyos-startup-retry");
        retry.style.display = "none";
        try {
          const theme = localStorage.getItem("studyos_theme");
          const isCoffee = theme === "coffee";
          const isLight = theme === "light" || isCoffee;
          for (const element of [document.documentElement, document.body]) {
            element.classList.toggle("light-theme", isLight);
            element.classList.toggle("coffee-theme", isCoffee);
          }
          if (isLight) {
            panel.style.background = isCoffee ? "#faf0df" : "#f7f8fa";
            panel.style.color = isCoffee ? "#422c23" : "#1b1c1f";
            document.getElementById("studyos-startup-description").style.color = isCoffee ? "#765749" : "#62666e";
            retry.style.background = isCoffee ? "#795344" : "#24262b";
            retry.style.color = "#fff";
            document.querySelector('meta[name="theme-color"]').content = panel.style.background;
          }
        } catch {}
        function revealRecovery() {
          if (!panel.isConnected) return;
          document.getElementById("studyos-startup-heading").textContent = "StudyOS is taking longer to load";
          document.getElementById("studyos-startup-description").textContent = "Check your connection and reload to try again. Your saved study data will not be cleared.";
          retry.hidden = false; retry.style.display = "inline-block";
          retry.href = location.href;
        }
        window.addEventListener("error", event => {
          if (event.target?.tagName === "SCRIPT" && event.target.type === "module") revealRecovery();
        }, true);
        setTimeout(revealRecovery, 15000);
      })();
    </script>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
