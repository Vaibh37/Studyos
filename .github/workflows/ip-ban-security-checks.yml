name: StudyOS security checks

on:
  schedule:
    # Daily dependency and security regression check; avoid the busy top of hour.
    - cron: "43 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "docs/IP-BANS.md"
      - "ops/verify-backup-restore.sh"
      - ".github/workflows/ip-ban-security-checks.yml"
  push:
    branches:
      - "main"
      - "security/ip-ban-protection"

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Reject tracked credentials and common secret patterns
        run: |
          node server/scripts/auditTrackedSecrets.js
          node server/scripts/auditHistorySecrets.js
      - name: Test backup and recovery on disposable MongoDB
        run: docker exec -i -e STUDYOS_BACKUP_DRILL=isolated-ci-only "${{ job.services.mongo.id }}" bash -s < ops/verify-backup-restore.sh
      - name: Install server dependencies exactly as locked
        run: npm ci --prefix server
      - name: Validate backend syntax
        run: |
          node --check server/server.js
          node --check server/models/BannedIp.js
          node --check server/utils/clientIp.js
          node --check server/middleware/ipBans.js
          node --check server/routes/securityAdminRoutes.js
          node --check server/scripts/ipBan.js
          node --check server/utils/groupRoomAccess.js
          node --check server/models/social/GroupAttachmentUpload.js
          node --check server/routes/groupAttachmentRoutes.js
          node --check server/models/FocusRun.js
          node --check server/models/StudySession.js
          node --check server/routes/studySessionRoutes.js
          node --check server/routes/leaderboardRoutes.js
          node --check server/tests/leaderboardIntegrity.test.js
          node --check server/models/Task.js
          node --check server/routes/taskRoutes.js
          node --check server/utils/leaderboardScore.js
          node --check server/tests/taskXpIntegrity.test.js
          node --check server/utils/socketInboundProtection.js
          node --check server/tests/socketInboundProtectionIntegration.test.js
          node --check server/utils/literalSearch.js
          node --check server/routes/noteRoutes.js
          node --check server/tests/privateDataAuthorization.test.js
          node --check server/routes/accountDeletionRoutes.js
          node --check server/routes/groupRoutes.js
          node --check server/tests/accountDeletionIntegrity.test.js
          node --check server/services/r2OrphanSweep.js
          node --check server/services/r2Storage.js
          node --check server/models/social/R2OrphanCandidate.js
          node --check server/models/social/R2OrphanScanState.js
          node --check server/tests/r2OrphanSweep.test.js
          node --check server/middleware/firebaseAuth.js
          node --check server/socket/socketAuth.js
          node --check server/utils/firebaseSocketSessionGuard.js
          node --check server/tests/firebaseSessionRevocation.test.js
          node --check server/middleware/apiRequestSafety.js
          node --check server/scripts/auditTrackedSecrets.js
          node --check server/tests/apiRequestSafety.test.js
          node --check server/middleware/appCheckGuard.js
          node --check server/middleware/turnstileGuard.js
          node --check server/tests/botProtection.test.js
          node --check server/tests/groupAttachmentAuthorization.test.js
      - name: Check production dependency advisories
        run: npm audit --prefix server --omit=dev --audit-level=moderate
      - name: Verify malformed API payloads fail safely
        run: node --test server/tests/apiRequestSafety.test.js server/tests/privacyHardening.test.js
      - name: Test IP parsing and administrative API
        run: node --test server/tests/clientIp.test.js server/tests/securityAdmin.test.js server/tests/groupRoomAccess.test.js
      - name: Install frontend dependencies exactly as locked
        run: npm ci --prefix client
      - name: Check frontend production dependency advisories
        run: npm audit --prefix client --omit=dev --audit-level=moderate
      - name: Test frontend reliability and account isolation
        run: node --test client/tests/*.test.mjs
      - name: Test backend privacy-safe monitoring and readiness
        run: node --test server/tests/productionMonitoring.test.js
      - name: Build the StudyOS UI
        run: npm run build --prefix client
      - name: Verify strict realtime events, admission, session expiry and upload signing
        run: node --test server/tests/realtimeSecurity.test.js
      - name: Verify App Check and Turnstile bot protection
        run: node --test server/tests/botProtection.test.js
      - name: Real HTTP + Socket.IO isolated MongoDB integration
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/ipBansIntegration.test.js
      - name: Two-user HTTP + live group Socket.IO revocation integration
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/groupSocketIntegration.test.js
      - name: Verify group attachment upload ownership and downloads
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/groupAttachmentAuthorization.test.js
      - name: Verify leaderboard scoring rejects forged and replayed Focus sessions
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/leaderboardIntegrity.test.js
      - name: Verify task completion XP integrity and anti-farming rules
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/taskXpIntegrity.test.js
      - name: Verify live Socket.IO flood protections across accounts and tabs
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/socketInboundProtectionIntegration.test.js
      - name: Verify private user data isolation and safe search
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/privateDataAuthorization.test.js
      - name: Verify account and group deletion data cleanup
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/accountDeletionIntegrity.test.js
      - name: Verify R2 orphan retention, audit, and safe cleanup
        env:
          STUDYOS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/studyos_security_ci
        run: node --test server/tests/r2OrphanSweep.test.js
      - name: Verify revoked Firebase sessions lose HTTP and Socket.IO access
        run: node --test server/tests/firebaseSessionRevocation.test.js
